<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Product Inventory Dashboard</title> <link rel="stylesheet" href="css/style.css"> </head>
<link rel="stylesheet" href="css/styles.css">
<body>

<main class="container">

    <h1>Product Inventory Dashboard</h1>

    <section class="controls">

        <div class="control-group">
            <label for="searchInput">Search Product</label>
            <input
                type="text"
                id="searchInput"
                placeholder="Enter product name"
            >
        </div>

        <div class="control-group">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
                <option value="All">All</option>
                <option value="Accessories">Accessories</option>
                <option value="Displays">Displays</option>
                <option value="Storage">Storage</option>
                <option value="Components">Components</option>
            </select>
        </div>

        <button id="searchBtn" type="button">
            Search Button
        </button>

        <button id="resetBtn" type="button">
            Reset Button
        </button>

    </section>

    <section class="summary">

        <div class="summary-card">
            <h2>Total Inventory Value</h2>
            <p id="totalInventoryValue">₱0</p>
        </div>

        <div class="summary-card">
            <h2>Low-Stock Products</h2>
            <p id="lowStockCount">0</p>
        </div>

        <div class="summary-card">
            <h2>Out-of-Stock Products</h2>
            <p id="outOfStockCount">0</p>
        </div>

    </section>

    <p id="noResultsMessage">No products found</p>

    <section id="productList" class="product-list"></section>

</main>

<script type="module" src="js/main.js"></script>

</body> </html>
